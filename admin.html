<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة المنتجات</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #f4f4f9; padding: 20px; direction: rtl; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:hover { background-color: #059669; }
    .product-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
    .delete-btn { background-color: #ef4444; width: auto; padding: 5px 10px; font-size: 14px; }
    .delete-btn:hover { background-color: #dc2626; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
  <h2>إضافة منتج جديد</h2>
  <form id="productForm">
    <div class="form-group">
      <label>اسم الطبق / المنتج:</label>
      <input type="text" id="name" required placeholder="مثال: بيتزا ببروني">
    </div>
    <div class="form-group">
      <label>السعر:</label>
      <input type="number" id="price" required placeholder="مثال: 150">
    </div>
    <button type="submit">إضافة للوحة التحكم</button>
  </form>

  <h2 style="margin-top: 30px;">المنتجات الحالية</h2>
  <div id="productsList">جاري التحميل...</div>
</div>

<script>
  // استبدل هذه القيم ببياناتك من حساب Supabase الخاص بك
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('productForm');
  const productsList = document.getElementById('productsList');

  // جلب المنتجات وعرضها
  async function loadProducts() {
    const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
    if (error) {
      productsList.innerHTML = 'حدث خطأ أثناء جلب المنتجات';
      return;
    }
    
    if (!data || data.length === 0) {
      productsList.innerHTML = '<p>لا توجد منتجات مضافة بعد.</p>';
      return;
    }

    productsList.innerHTML = '';
    data.forEach(item => {
      const div = document.createElement('div');
      div.className = 'product-item';
      div.innerHTML = `
        <span><strong>${item.name}</strong> - ${item.price} ج.م</span>
        <button class="delete-btn" onclick="deleteProduct(${item.id})">حذف</button>
      `;
      productsList.appendChild(div);
    });
  }

  // إضافة منتج جديد
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value;

    const { error } = await db.from('products').insert([{ name, price }]);
    if (error) {
      alert('خطأ في الإضافة: ' + error.message);
    } else {
      form.reset();
      loadProducts();
    }
  });

  // حذف منتج
  async function deleteProduct(id) {
    if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
      const { error } = await db.from('products').delete().eq('id', id);
      if (error) {
        alert('خطأ أثناء الحذف: ' + error.message);
      } else {
        loadProducts();
      }
    }
  }

  loadProducts();
</script>

</body>
</html>
